app-id: io.github.victoralvesf.aonsoku
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node26
command: aonsoku.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create
  - --talk-name=com.canonical.AppIndicator
  # media player controls
  - --own-name=org.mpris.MediaPlayer2.chromium.*
build-options:
  append-path: /usr/lib/sdk/node26/bin
modules:
  - name: aonsoku
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node26/bin
      env:
        npm_config_nodedir: /usr/lib/sdk/node26
        XDG_CACHE_HOME: /run/build/aonsoku/flatpak-node-cache
        electron_config_cache: /run/build/aonsoku/flatpak-node-cache/electron
        ELECTRON_CACHE: /run/build/aonsoku/flatpak-node-cache/electron
        npm_config_cache: /run/build/aonsoku/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - rm -f pnpm-lock.yaml
      - rm -rf node_modules
      - rm -f package-lock.json
      - sed -i '/packageManager/d' package.json
      - jq '.build.linux.target="dir"' <<<$(<package.json) > package.json
      - jq '.build.electronDist="/run/build/aonsoku/flatpak-node-cache/electron"' <<<$(<package.json) > package.json
      - jq '.build.productName="aonsoku" | .build.appId="io.github.victoralvesf.aonsoku" | .build.linux.executableName="aonsoku"' <<<$(<package.json) > package.json
      - jq '.build.asar=false' <<<$(<package.json) > package.json
      - jq '.build.files=["**/*", "!flatpak-node/**", "!flatpak-node-cache/**"]' <<<$(<package.json) > package.json
      - yarn cache clean --offline
      - ELECTRON_SKIP_BINARY_DOWNLOAD=1 CYPRESS_INSTALL_BINARY=0 yarn --offline
      - yarn run electron:build
      - |
        . ./flatpak-node/electron-builder-arch-args.sh
        yarn run build:linux $ELECTRON_BUILDER_ARCH_ARGS --dir
      - ls -lha /run/build/aonsoku/dist/linux-unpacked
      - cp -a dist/linux*unpacked /app/main
      - install -Dm755 -t /app/bin/ aonsoku.sh
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop      /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 resources/icons/icon.png     /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
    sources:
      - type: git
        url: https://github.com/victoralvesf/aonsoku.git
        commit: 9d5197c4f28040076d06dafa892215a9b65a873f
      - type: file
        url: https://github.com/electron/electron/releases/download/v43.1.1/electron-v43.1.1-linux-x64.zip
        sha256: "c1f479c52747caf1510e17500e1c8a556d0e40802837bd48c5647a84688a3880"
        dest: flatpak-node-cache/electron
        dest-filename: electron-v43.1.1-linux-x64.zip
      - type: file
        url: https://github.com/electron/electron/releases/download/v43.1.1/electron-v43.1.1-linux-arm64.zip
        sha256: "30ed0b3672dd71672f6496fa0ba0c770ac7f8c6d9b38f01f615a6923b1541311"
        dest: flatpak-node-cache/electron
        dest-filename: electron-v43.1.1-linux-arm64.zip
      - type: inline
        dest-filename: .yarnrc
        contents: |
          yarn-offline-mirror "/run/build/aonsoku/flatpak-node/yarn-mirror"
          cache-folder "/run/downloads"
          prefix "/run/downloads"
          --install.offline true
          --run.offline true
      - yarn-sources.json
      - type: file
        path: yarn.lock
      - type: script
        dest-filename: aonsoku.sh
        commands:
          - zypak-wrapper /app/main/aonsoku "$@"